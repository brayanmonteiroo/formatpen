name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --lib

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar e iniciar UDisks2 e D-Bus
        run: |
          sudo apt-get update
          sudo apt-get install -y udisks2 polkitd dbus
          sudo systemctl start dbus
          sudo systemctl start udisks2
          for i in $(seq 1 30); do
            if busctl --system list 2>/dev/null | grep -q UDisks2; then
              echo "UDisks2 disponível no D-Bus"
              exit 0
            fi
            sleep 1
          done
          echo "UDisks2 não respondeu a tempo" >&2
          busctl --system list || true
          exit 1
      - run: cargo test --test udisks_integration

  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Instalar GTK4 e Libadwaita
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev xvfb
      - uses: GabrielBB/xvfb-action@v1
        with:
          run: cargo test --test ui -- --test-threads=1
