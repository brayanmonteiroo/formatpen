[package]
name = "formatpen"
version = "1.0.9"
edition = "2021"
description = "Formatador de pendrive com interface GTK4"
authors = ["FormatPen"]
license = "MIT"

[lib]
name = "formatpen"
path = "src/lib.rs"

[[bin]]
name = "formatpen"
path = "src/main.rs"

[[test]]
name = "ui"
path = "tests/ui/mod.rs"
harness = true

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", package = "libadwaita", features = ["v1_4"] }
glib = "0.21"
gio = "0.21"
zbus = { version = "4", features = ["blocking"] }
thiserror = "2"
anyhow = "1"
appimageupdate = "0.3.2"
