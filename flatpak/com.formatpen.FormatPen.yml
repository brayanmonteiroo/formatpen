# Manifest Flatpak — FormatPen
# Documentação: flatpak/README.md

id: com.formatpen.FormatPen
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: formatpen

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=all
  - --filesystem=host
  - --talk-name=org.freedesktop.UDisks2
  - --system-talk-name=org.freedesktop.UDisks2
  - --talk-name=org.freedesktop.PolicyKit1

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/formatpen/cargo
    RUSTUP_HOME: /usr/lib/sdk/rust-stable/rustup
    RUST_BACKTRACE: "1"
  # flatpak-builder 1.4.x não tem "network: true"; repassa rede ao sandbox do build.
  build-args:
    - --share=network

modules:
  - name: formatpen
    buildsystem: simple
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/formatpen /app/bin/formatpen
      - install -Dm644 data/com.formatpen.FormatPen.desktop /app/share/applications/com.formatpen.FormatPen.desktop
      - install -Dm644 data/com.formatpen.FormatPen.metainfo.xml /app/share/metainfo/com.formatpen.FormatPen.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/com.formatpen.FormatPen.svg /app/share/icons/hicolor/scalable/apps/com.formatpen.FormatPen.svg
    sources:
      # Build local (a partir da raiz do repositório)
      - type: dir
        path: ..
      # Para Flathub, substitua por:
      # - type: git
      #   url: https://github.com/brayanmonteiroo/formatpen.git
      #   tag: v1.0.0
      #   commit: <hash-do-tag>
